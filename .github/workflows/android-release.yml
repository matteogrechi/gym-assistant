name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
          echo "RELEASE_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: JVM checks and release lint
        run: ./gradlew --no-daemon :domain:test :app:testReleaseUnitTest :app:lintRelease -PreleaseVersionCode="$RELEASE_CODE"
      - name: Build signed APK and bundle
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
        run: |
          : "${ANDROID_SIGNING_KEYSTORE_BASE64:?Missing signing keystore secret}"
          : "${ANDROID_RELEASE_KEYSTORE_PASSWORD:?Missing signing password secret}"
          export ANDROID_RELEASE_KEYSTORE="$RUNNER_TEMP/gym-assystant.p12"
          trap 'rm -f "$ANDROID_RELEASE_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE"
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease -PreleaseVersionCode="$RELEASE_CODE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/bundle-verification.txt"
          grep -q 'jar verified\.' "$RUNNER_TEMP/bundle-verification.txt"
          mkdir -p "$RUNNER_TEMP/release"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release/gym-assystant-0.1.$RELEASE_CODE.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/release/gym-assystant-0.1.$RELEASE_CODE.aab"
      - name: Publish exact-commit release (safe retry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          def guard(release, tag_sha, expected):
              if tag_sha != expected or (release and release['target_commitish'] != expected):
                  raise RuntimeError('Release/tag belongs to a different commit; refusing to publish')

          # Exercise both identity boundaries before any remote mutation.
          guard(None, 'a', 'a')
          guard({'target_commitish': 'a'}, 'a', 'a')
          for release, tag_sha in [(None, 'b'), ({'target_commitish': 'b'}, 'a')]:
              try:
                  guard(release, tag_sha, 'a')
              except RuntimeError:
                  pass
              else:
                  raise AssertionError('Identity guard accepted a different commit')

          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)

          def optional_api(endpoint):
              result = subprocess.run(['gh', 'api', endpoint], capture_output=True, text=True)
              if result.returncode == 0:
                  return json.loads(result.stdout)
              if '(HTTP 404)' in result.stderr:
                  return None
              raise RuntimeError(result.stderr)

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          version = '0.1.' + os.environ['RELEASE_CODE']
          tag = 'v' + version
          endpoint = f'repos/{repo}'
          release = optional_api(f'{endpoint}/releases/tags/{tag}')
          commit = optional_api(f'{endpoint}/commits/{tag}')
          guard(release, commit['sha'] if commit else sha, sha)
          if release and not commit:
              raise RuntimeError('Existing release has no resolvable tag')
          if not commit:
              gh('api', '--method', 'POST', f'{endpoint}/git/refs',
                 '-f', f'ref=refs/tags/{tag}', '-f', f'sha={sha}')
          if not release:
              gh('release', 'create', tag, '--repo', repo, '--target', sha, '--verify-tag', '--draft',
                 '--title', f'gym assystant {version}', '--notes',
                 f'Commit: {sha}\nSigned offline Android APK and Play submission bundle.\n'
                 'Verify SHA256SUMS before installing. See docs/architecture/android-distribution.md.')
              release = json.loads(gh('api', f'{endpoint}/releases/tags/{tag}'))
          guard(release, json.loads(gh('api', f'{endpoint}/commits/{tag}'))['sha'], sha)
          directory = Path(os.environ['RUNNER_TEMP']) / 'release'
          assets = {asset['name'] for asset in release['assets']}
          names = [f'gym-assystant-{version}.{extension}' for extension in ('apk', 'aab')]
          for name in names:
              if name in assets:
                  # Preserve already-uploaded bytes; rebuilding can change ZIP timestamps.
                  gh('release', 'download', tag, '--repo', repo, '--pattern', name,
                     '--dir', str(directory), '--clobber')
              else:
                  gh('release', 'upload', tag, str(directory / name), '--repo', repo)
          checksums = ''.join(f'{hashlib.sha256((directory / name).read_bytes()).hexdigest()}  {name}\n'
                              for name in names)
          checksum_file = directory / 'SHA256SUMS'
          if 'SHA256SUMS' in assets:
              gh('release', 'download', tag, '--repo', repo, '--pattern', 'SHA256SUMS',
                 '--dir', str(directory))
              if checksum_file.read_text() != checksums:
                  raise RuntimeError('Existing release checksums do not match; refusing to overwrite')
          else:
              checksum_file.write_text(checksums)
              gh('release', 'upload', tag, str(checksum_file), '--repo', repo)
          subprocess.run([os.environ['ANDROID_HOME'] + '/build-tools/35.0.0/apksigner',
                          'verify', str(directory / names[0])], check=True)
          bundle_check = subprocess.check_output(
              ['jarsigner', '-verify', str(directory / names[1])], text=True)
          if 'jar verified.' not in bundle_check:
              raise RuntimeError('Bundle signature verification failed')
          # Check identity again immediately before publishing; never move an existing tag.
          guard(release, json.loads(gh('api', f'{endpoint}/commits/{tag}'))['sha'], sha)
          if release['draft']:
              gh('release', 'edit', tag, '--repo', repo, '--draft=false')
          print(f'Published {tag} for {sha}')
          PY
